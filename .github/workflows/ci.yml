name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 数据门禁 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段固定，此处不再重复声明
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 站点数据 schema 门禁：阻断 id 重复、字段缺失等结构性问题
      - name: 数据门禁
        run: pnpm run validate

      # 构建门禁：确保可产出可部署产物
      - name: 构建门禁
        run: pnpm run build