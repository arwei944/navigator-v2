<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>nav probe</title>
<style>
  body { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 10px; background: #0b0b0f; color: #b9f6ca; }
  pre { white-space: pre-wrap; margin: 0; }
  iframe { position: fixed; left: -20000px; top: 0; border: 0; }
</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<script>
const COLLECTOR = 'http://127.0.0.1:4599/report'
const out = document.getElementById('out')
const lines = []
function log(s) { lines.push(s); out.textContent = lines.join('\n') }
const sleep = ms => new Promise(r => setTimeout(r, ms))
const round = n => (typeof n === 'number' && isFinite(n) ? Math.round(n * 10) / 10 : n)

function waitFor(fn, timeout = 9000, step = 120) {
  return new Promise((resolve) => {
    const t0 = Date.now()
    const tick = () => {
      let v = false
      try { v = fn() } catch (e) { v = false }
      if (v) return resolve(true)
      if (Date.now() - t0 > timeout) return resolve(false)
      setTimeout(tick, step)
    }
    tick()
  })
}

async function mount(w, h, path) {
  const f = document.createElement('iframe')
  f.style.width = w + 'px'
  f.style.height = h + 'px'
  f.setAttribute('src', path)
  document.body.appendChild(f)
  await new Promise(res => {
    let done = false
    const fin = () => { if (!done) { done = true; res() } }
    f.addEventListener('load', fin, { once: true })
    setTimeout(fin, 10000)
  })
  await waitFor(() => f.contentDocument?.querySelector('.sidebar-nav-item'), 9000)
  await sleep(1400)
  return f
}

function snap(f) {
  const d = f.contentDocument, w = f.contentWindow
  const q = s => d.querySelector(s)
  const all = s => Array.from(d.querySelectorAll(s))
  const rect = el => { try { return el ? el.getBoundingClientRect() : null } catch (e) { return null } }
  const cs = (el, p) => { try { return el ? w.getComputedStyle(el)[p] : null } catch (e) { return null } }
  const wOf = el => round(rect(el)?.width)
  const sidebar = q('aside.sidebar')
  const navItems = all('.sidebar-nav .sidebar-nav-item')
  const active = navItems.find(n => n.classList.contains('active'))
  const activeTab = all('.mobile-tabbar .tab').find(t => t.classList.contains('active'))
  const groupHeaders = all('.category-group-header')
  const lastGroup = groupHeaders[groupHeaders.length - 1]
  const cards = all('.cards-grid .card, .cards-list .card')
  return {
    url: w.location.pathname + w.location.search,
    title: d.title,
    mainW: wOf(q('main.main')),
    sidebarW: wOf(sidebar),
    sbInlineW: sidebar?.style.width || null,
    sidebarPos: cs(sidebar, 'position'),
    sidebarTransform: cs(sidebar, 'transform'),
    sidebarCollapsed: sidebar?.classList.contains('collapsed'),
    sidebarOpen: sidebar?.classList.contains('open'),
    rightDisplay: cs(q('.right-sidebar'), 'display'),
    rightW: wOf(q('.right-sidebar')),
    headerDisplay: cs(q('.mobile-header'), 'display'),
    headerW: wOf(q('.mobile-header')),
    tabbarDisplay: cs(q('.mobile-tabbar'), 'display'),
    tabbarW: wOf(q('.mobile-tabbar')),
    tabLabels: all('.mobile-tabbar .tab').map(t => t.textContent.trim()).join('|'),
    activeTab: activeTab ? activeTab.textContent.trim() : null,
    overlayShown: q('.overlay')?.classList.contains('show'),
    hOverflow: d.documentElement.scrollWidth - w.innerWidth,
    navItems: navItems.length,
    activeNavItem: active ? active.textContent.trim() : null,
    groupHeaders: groupHeaders.length,
    lastGroupBottom: round(rect(lastGroup)?.bottom),
    sidebarClientH: sidebar ? sidebar.clientHeight : null,
    sidebarScrollH: sidebar ? sidebar.scrollHeight : null,
    cardsRendered: cards.length,
    toolbarVisible: !!q('.cards-toolbar'),
    trashHeaderVisible: !!q('.trash-header'),
    feedVisible: !!q('.feed-panel'),
    palette: !!q('.cp-panel'),
    batchBar: !!q('.batch-bar'),
    batchBarTop: round(rect(q('.batch-bar'))?.top),
    tabbarTop: round(rect(q('.mobile-tabbar'))?.top),
    errors: w.__probeErrors || []
  }
}

const LAYOUT = [
  { path: '/', w: 375, h: 812 },
  { path: '/', w: 768, h: 812 },
  { path: '/', w: 1024, h: 900 },
  { path: '/', w: 1280, h: 900 },
  { path: '/', w: 1440, h: 900 },
  { path: '/', w: 1920, h: 1080 },
  { path: '/favorites', w: 375, h: 812 },
  { path: '/recent', w: 375, h: 812 },
  { path: '/trash', w: 375, h: 812 },
  { path: '/feed', w: 375, h: 812 },
  { path: '/favorites', w: 1440, h: 900 },
  { path: '/c/cex?sort=hot', w: 1440, h: 900 },
  { path: '/category/cex', w: 1440, h: 900 }
]

const report = { layout: [], interaction: [], errors: [] }

async function runLayout() {
  for (const cfg of LAYOUT) {
    let f
    try {
      f = await mount(cfg.w, cfg.h, cfg.path)
      const s = snap(f)
      const inFirst = (() => {
        const d = f.contentDocument
        return Array.from(d.querySelectorAll('.cards-grid .card, .cards-list .card'))
          .filter(c => { const r = c.getBoundingClientRect(); return r.top >= 0 && r.bottom <= cfg.h }).length
      })()
      s.cfg = cfg.path + ' @' + cfg.w
      s.cardsInFirstScreen = inFirst
      report.layout.push(s)
      log('L ' + s.cfg + ' main=' + s.mainW + ' side=' + s.sidebarW + ' overflow=' + s.hOverflow)
    } catch (e) {
      report.errors.push('layout ' + cfg.path + '@' + cfg.w + ': ' + e)
    } finally { if (f) f.remove() }
    await sleep(200)
  }
}

async function runMobileFlow() {
  const f = await mount(375, 812, '/')
  const d = f.contentDocument, w = f.contentWindow
  w.__probeErrors = []
  w.addEventListener('error', e => w.__probeErrors.push(String(e.message)))
  const step = (label) => report.interaction.push({ flow: 'mobile', step: label, ...snap(f) })
  const tabs = () => Array.from(d.querySelectorAll('.mobile-tabbar .tab'))

  step('baseline')
  d.querySelector('.hamburger').click(); await sleep(500); step('hamburger-open')
  d.querySelector('.overlay').click(); await sleep(500); step('overlay-close')
  tabs()[3].click(); await sleep(500); step('tab-more')
  d.querySelector('.overlay').click(); await sleep(400)
  tabs()[1].click(); await sleep(600); step('tab-favorites')
  w.history.back(); await sleep(700); step('browser-back')
  tabs()[0].click(); await sleep(600); step('tab-all')
  d.querySelector('.hamburger').click(); await sleep(500)
  const cex = Array.from(d.querySelectorAll('.sidebar-category')).find(c => c.textContent.includes('交易所 CEX'))
  if (cex) { cex.click(); await sleep(700) }
  step('drawer-category')
  const selBtn = Array.from(d.querySelectorAll('.toolbar-btn')).find(b => b.textContent.includes('选择'))
  if (selBtn) { selBtn.click(); await sleep(400) }
  const card = d.querySelector('.card')
  if (card) { card.click(); await sleep(500) }
  step('batch-select')
  f.remove()
}

async function runDesktopFlow() {
  const f = await mount(1440, 900, '/')
  const d = f.contentDocument, w = f.contentWindow
  w.__probeErrors = []
  w.addEventListener('error', e => w.__probeErrors.push(String(e.message)))
  const step = (label) => report.interaction.push({ flow: 'desktop', step: label, ...snap(f) })

  step('baseline')
  d.querySelector('.sidebar-collapse-toggle').click(); await sleep(600); step('collapse')
  d.querySelector('.sidebar-collapse-toggle').click(); await sleep(600); step('expand')
  const cex = Array.from(d.querySelectorAll('.sidebar-category')).find(c => c.textContent.includes('交易所 CEX'))
  if (cex) { cex.click(); await sleep(700) }
  step('click-category')
  const input = d.querySelector('.site-search-input')
  input.value = 'binance'
  input.dispatchEvent(new w.Event('input', { bubbles: true }))
  await sleep(1100); step('search-type')
  const clearBtn = d.querySelector('.search-clear')
  if (clearBtn) { clearBtn.click(); await sleep(1100) }
  step('search-clear')
  d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }))
  await sleep(400); step('ctrl-k')
  const cpInput = d.querySelector('.cp-panel input')
  if (cpInput) cpInput.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
  await sleep(400); step('escape')
  const selBtn = Array.from(d.querySelectorAll('.toolbar-btn')).find(b => b.textContent.includes('选择'))
  if (selBtn) { selBtn.click(); await sleep(400) }
  const card = d.querySelector('.card')
  if (card) { card.click(); await sleep(500) }
  step('batch-select')
  const cancelBtn = Array.from(d.querySelectorAll('.batch-btn')).find(b => b.textContent.includes('取消全选'))
  if (cancelBtn) { cancelBtn.click(); await sleep(400) }
  const exitBtn = Array.from(d.querySelectorAll('.toolbar-btn')).find(b => b.textContent.includes('取消选择'))
  if (exitBtn) { exitBtn.click(); await sleep(400) }
  step('batch-exit')
  const dragBtn = Array.from(d.querySelectorAll('.drag-toggle')).find(b => b.textContent.includes('排序'))
  if (dragBtn) { dragBtn.click(); await sleep(400) }
  step('drag-toggle')
  f.remove()
}

async function send() {
  const payload = JSON.stringify(report, null, 1)
  try {
    const r = await fetch(COLLECTOR, { method: 'POST', body: payload })
    log('POST ' + r.status + ' bytes=' + payload.length)
  } catch (e) {
    log('POST-FAIL ' + e)
  }
}

;(async () => {
  try { await runLayout() } catch (e) { report.errors.push('layout-flow: ' + e) }
  try { await runMobileFlow() } catch (e) { report.errors.push('mobile-flow: ' + e) }
  try { await runDesktopFlow() } catch (e) { report.errors.push('desktop-flow: ' + e) }
  await send()
  log('DONE')
})()
</script>
</body>
</html>
