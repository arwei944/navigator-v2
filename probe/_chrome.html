<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>chrome probe</title>
<style>
  body { font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 12px; background: #0b0b0f; color: #b9f6ca; }
  pre { white-space: pre-wrap; margin: 0; }
  iframe { position: fixed; left: -20000px; top: 0; border: 0; }
</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<script>
/* AC-6「首屏内容优先」的取证：量出网格之上每一层 chrome 占掉多少高度，
 * 以及首屏到底能露出几张卡片。只看数字，不做判断。 */
const CASES = [
  { path: '/', w: 1440, h: 900 },
  { path: '/', w: 1920, h: 1080 },
  { path: '/', w: 1280, h: 800 },
]

const CHROME = [
  ['.mobile-header', '移动顶栏'],
  ['.main-toolbar', '工具栏(搜索+操作)'],
  ['.filter-bar', '筛选条(域+子分类)'],
]

const out = document.getElementById('out')
const lines = []
function log(s) { lines.push(s); out.textContent = lines.join('\n') }

const sleep = ms => new Promise(r => setTimeout(r, ms))
function waitFor(fn, timeout = 9000, step = 120) {
  return new Promise((resolve) => {
    const t0 = Date.now()
    const tick = () => {
      let v = false
      try { v = fn() } catch (e) { v = false }
      if (v) return resolve(true)
      if (Date.now() - t0 > timeout) return resolve(false)
      setTimeout(tick, step)
    }
    tick()
  })
}
const round = n => (typeof n === 'number' && isFinite(n) ? Math.round(n * 10) / 10 : n)

async function run(cfg) {
  const f = document.createElement('iframe')
  f.style.width = cfg.w + 'px'
  f.style.height = cfg.h + 'px'
  f.setAttribute('src', cfg.path)
  document.body.appendChild(f)
  await new Promise(res => {
    let done = false
    const finish = () => { if (!done) { done = true; res() } }
    f.addEventListener('load', finish, { once: true })
    setTimeout(finish, 10000)
  })
  await waitFor(() => {
    const d = f.contentDocument
    return !!(d && d.querySelector('main.main') && d.querySelector('.cards-grid .card'))
  })
  await sleep(1200)

  const win = f.contentWindow
  const doc = f.contentDocument
  const rect = el => { try { return el ? el.getBoundingClientRect() : null } catch (e) { return null } }
  const rows = []
  let sum = 0
  for (const [sel, label] of CHROME) {
    const el = doc.querySelector(sel)
    const r = rect(el)
    const h = r ? r.height : 0
    if (r && win.getComputedStyle(el).display !== 'none') sum += h
    rows.push({ label, h: round(h), top: r ? round(r.top) : null, shown: !!(r && r.height > 0) })
  }

  const cards = Array.from(doc.querySelectorAll('.cards-grid .card'))
  const grid = doc.querySelector('.cards-grid')
  const gridTop = grid ? round(rect(grid).top) : null
  const inFirst = cards.filter(c => {
    const r = rect(c)
    return r && r.top >= 0 && r.bottom <= cfg.h
  }).length

  log(`CASE ${cfg.path} @${cfg.w}x${cfg.h}`)
  for (const r of rows) log(`   ${r.shown ? ' ' : 'x'} ${String(r.label).padEnd(14)} h=${String(r.h).padStart(6)}  top=${String(r.top).padStart(6)}`)
  log(`   网格起点 top=${gridTop}   网格上方合计≈${round(sum)}px`)
  log(`   首屏完整可见卡片=${inFirst}   视口高=${cfg.h}`)
  log(`   结论：可用给内容的高度≈${cfg.h - (gridTop ?? 0)}px`)

  // 宽度取证：工具栏为什么不换行 / 筛选条每层多高
  const mw = el => { const r = rect(el); return r ? round(r.width) : null }
  const mainEl = doc.querySelector('main.main')
  const bar = doc.querySelector('.main-toolbar')
  log(`   -- 宽度：main=${mw(mainEl)} toolbar=${mw(bar)}`)
  if (bar) {
    for (const child of bar.children) {
      log(`      · ${(child.className || child.tagName).toString().padEnd(18)} w=${String(mw(child)).padStart(6)}`)
    }
    const sw = bar.querySelector('.search-input-wrap')
    const ext = bar.querySelector('.ext-search')
    const acts = bar.querySelector('.toolbar-actions')
    log(`      · search-input-wrap w=${mw(sw)}  ext-search w=${mw(ext)}  actions w=${mw(acts)}`)
  }
  const fb = doc.querySelector('.filter-bar')
  log(`   -- 筛选条：h=${mw(fb) === null ? null : round(rect(fb).height)} domain-tabs=${round(rect(doc.querySelector('.domain-tabs'))?.height)} chip-row=${round(rect(doc.querySelector('.chip-row'))?.height)} 组数=${doc.querySelectorAll('.chip-group').length} chip数=${doc.querySelectorAll('.chip-row .chip').length}`)

  f.remove()
  await sleep(200)
}

;(async () => {
  log('RUN ' + new Date().toISOString())
  for (const c of CASES) {
    try { await run(c) } catch (e) { log('FAIL ' + c.path + ' @' + c.w + ' ' + e) }
  }
  // 回传到独立端口的收集器（4600 → _chrome-report.json），不碰主探针报告
  log('DONE ' + CASES.length + ' cases')
  try {
    await fetch('http://127.0.0.1:4600/report', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ lines })
    })
    log('POSTED')
  } catch (e) { log('POST-SKIP ' + String(e)) }
})()
</script>
</body>
</html>
