  iframe { position: fixed; left: -20000px; top: 0; border: 0; }

<body>
<pre id="out">RUNNING</pre>
<script>
const CASES = [
  { path: '/',            w: 375,  h: 812 },
  { path: '/',            w: 768,  h: 812 },
  { path: '/',            w: 1024, h: 900 },
  { path: '/',            w: 1280, h: 900 },
  { path: '/',            w: 1440, h: 900 },
  { path: '/',            w: 1920, h: 1080 },
  { path: '/favorites',   w: 375,  h: 812 },
  { path: '/recent',      w: 375,  h: 812 },
  { path: '/trash',       w: 375,  h: 812 },
  { path: '/feed',        w: 375,  h: 812 },
  { path: '/favorites',   w: 1440, h: 900 },
  { path: '/c/cex?sort=hot', w: 1440, h: 900 },
  { path: '/category/cex',   w: 1440, h: 900 },
  // 域（整域筛选）与子分类（单分类筛选）两级，桌面与移动各取一
  { path: '/c/ai',        w: 1440, h: 900 },
  { path: '/c/crypto',    w: 1440, h: 900 },
  { path: '/c/ai',        w: 375,  h: 812 },
  { path: '/c/cex',       w: 375,  h: 812 },

  // 交互：域 → 子分类 → 换子分类 → 再点已选中子分类（应退回整域）→ 点「全部」域
  { path: '/', w: 1440, h: 900, steps: [
    { kind: 'domain', label: '币圈' },
    { kind: 'chip',   label: '交易所 CEX' },
    { kind: 'chip',   label: '钱包' },
    { kind: 'chip',   label: '钱包' },
    { kind: 'domain', label: '全部' },
  ]},
  // 深链直达子分类：init 快照即可验证两级高亮是否还原（同时验证 /c/:id → /?c=:id 重定向）
  { path: '/c/cex', w: 1440, h: 900 },
  { path: '/c/cex', w: 375,  h: 812 },
  // 移动端筛选条可用性
  { path: '/', w: 375, h: 812, steps: [
    { kind: 'domain', label: '工具' },
    { kind: 'chip',   label: '短信接码' },
  ]},
  // 关键回归：收藏范围内筛方向，必须留在 /favorites（修复前会被弹回全量范围）
  { path: '/favorites', w: 1440, h: 900, steps: [
    { kind: 'domain', label: '币圈' },
    { kind: 'chip',   label: '交易所 CEX' },
    { kind: 'chip',   label: '交易所 CEX' },
    { kind: 'domain', label: '全部' },
  ]},
  // 最近范围同理
  { path: '/recent', w: 1440, h: 900, steps: [
    { kind: 'domain', label: '工具' },
  ]},
  // 收藏 + 域的深链组合应可直接打开
  { path: '/favorites?c=crypto', w: 1440, h: 900 },

  // AC-2：移动端汉堡开合抽屉（静态测量只能证明按钮有宽度，开合必须真点）
  { path: '/', w: 375, h: 812, drawer: true },
  // AC-3：浏览器返回键逐级回退（收藏 → 筛域 → 返回，必须回到收藏且计数复原）
  { path: '/favorites', w: 1440, h: 900, back: true },

  // AC-5：命令面板分类检索（输入「交」→ 命中「交易所 CEX」→ 点击进入 /?c=cex）
  { path: '/', w: 1440, h: 900, palette: true },
  // AC-7：键盘链路（键盘切范围 → 命令面板选分类 → 卡片访问链接可聚焦）
  { path: '/', w: 1440, h: 900, keyboard: true },
  // AC-10：侧栏偏好持久化（折叠 → 重载 iframe → 仍折叠）
  { path: '/', w: 1440, h: 900, persist: true },
  // AC-9：八项能力巡检（放在最后，内部会改状态并复原）
  { path: '/', w: 1440, h: 900, capability: true }
]

const out = document.getElementById('out')
const lines = []
function log(s) { lines.push(s); out.textContent = lines.join('\n') }

const sleep = ms => new Promise(r => setTimeout(r, ms))

function waitFor(fn, timeout = 9000, step = 120) {
  return new Promise((resolve) => {
    const t0 = Date.now()
    const tick = () => {
      let v = false
      try { v = fn() } catch (e) { v = false }
      if (v) return resolve(true)
      if (Date.now() - t0 > timeout) return resolve(false)
      setTimeout(tick, step)
    }
    tick()
  })
}

const round = n => (typeof n === 'number' && isFinite(n) ? Math.round(n * 10) / 10 : n)

function measure(win, doc, cfg) {
  const q = s => doc.querySelector(s)
  const all = s => Array.from(doc.querySelectorAll(s))
  const rect = el => { try { return el ? el.getBoundingClientRect() : null } catch (e) { return null } }
  const cs = (el, p) => { try { return el ? win.getComputedStyle(el)[p] : null } catch (e) { return null } }
  const wOf = el => round(rect(el)?.width)

  const sidebar = q('aside.sidebar')
  const right = q('.right-sidebar')
  const mh = q('.mobile-header')
  const tb = q('.mobile-tabbar')
  const main = q('main.main')
  const navItems = all('.sidebar-nav .sidebar-nav-item')
  const cards = all('.cards-grid .card, .cards-list .card')

  const filterBar = q('.filter-bar')
  const domainTabs = all('.filter-bar .domain-tab')
  const activeDomain = domainTabs.find(t => t.classList.contains('active'))
  const chips = all('.filter-bar .chip')
  const activeChip = chips.find(c => c.classList.contains('active'))
  const chipRow = q('.filter-bar .chip-row')

  const inFirstScreen = cards.filter(c => {
    const r = rect(c)
    return r && r.top >= 0 && r.bottom <= cfg.h
  }).length

  const activeItem = navItems.find(n => n.classList.contains('active'))

  // AC-4：5 个范围项是否无需滚动即可全部看到（桌面 900 高）
  const navRects = navItems.map(n => rect(n)).filter(Boolean)
  const navAllVisible = navRects.length === 5 && navRects.every(r => r.top >= -0.5 && r.bottom <= cfg.h + 0.5)

  // AC-6：网格上方压了多少层 chrome（行数 + 总高）
  const CHROME = ['.stats-bar', '.top-widgets', '.google-search', '.site-search', '.filter-bar', '.cards-toolbar']
  const chromeEls = CHROME.map(s => q(s)).filter(el => el && rect(el) && rect(el).height > 0.5)
  const chromeTotal = round(chromeEls.reduce((sum, el) => sum + rect(el).height, 0))
  const grid = q('.cards-grid, .cards-list')

  return {
    cfg: cfg.path + ' @' + cfg.w,
    url: win.location.pathname + win.location.search,
    title: doc.title,
    mainW: wOf(main),
    sidebarW: wOf(sidebar),
    sidebarPos: cs(sidebar, 'position'),
    sidebarTransform: cs(sidebar, 'transform'),
    rightDisplay: cs(right, 'display'),
    rightW: wOf(right),
    headerDisplay: cs(mh, 'display'),
    headerW: wOf(mh),
    tabbarDisplay: cs(tb, 'display'),
    tabbarW: wOf(tb),
    tabLabels: all('.mobile-tabbar .tab').map(t => t.textContent.trim()).join('|'),
    hOverflow: doc.documentElement.scrollWidth - win.innerWidth,
    navItems: navItems.length,
    activeNavItem: activeItem ? activeItem.textContent.trim() : null,
    sidebarClientH: sidebar ? sidebar.clientHeight : null,
    sidebarScrollH: sidebar ? sidebar.scrollHeight : null,
    sidebarOverflow: sidebar ? sidebar.scrollHeight - sidebar.clientHeight : null,
    filterBarVisible: !!filterBar,
    domainTabs: domainTabs.length,
    domainLabels: domainTabs.map(t => t.textContent.trim().replace(/\s+/g, ' ')).join('|'),
    activeDomain: activeDomain ? activeDomain.textContent.trim().replace(/\s+/g, ' ') : null,
    chips: chips.length,
    activeChip: activeChip ? activeChip.textContent.trim().replace(/\s+/g, ' ') : null,
    chipRowOverflowX: chipRow ? chipRow.scrollWidth - chipRow.clientWidth : null,
    cardsRendered: cards.length,
    cardsInFirstScreen: inFirstScreen,
    navAllVisible,
    chromeRows: chromeEls.length,
    chromeTotal,
    gridTop: grid ? round(rect(grid).top) : null,
    toolbarVisible: !!q('.cards-toolbar'),
    trashHeaderVisible: !!q('.trash-header'),
    feedVisible: !!q('.feed-panel'),
    searchVisible: !!q('.site-search')
  }
}

/* ---- 筛选条交互验证：点域 / 点子分类，断言 URL 与「计数 = 卡片数」 ---- */

function findByText(doc, sel, text) {
  return Array.from(doc.querySelectorAll(sel))
    .find(el => el.textContent.trim().replace(/\s+/g, ' ').startsWith(text))
}

function snapState(win, doc, tag) {
  const all = s => Array.from(doc.querySelectorAll(s))
  const tabs = all('.filter-bar .domain-tab')
  const activeTab = tabs.find(t => t.classList.contains('active'))
  const chips = all('.filter-bar .chip')
  const activeChip = chips.find(c => c.classList.contains('active'))
  const cards = all('.cards-grid .card, .cards-list .card')
  const tabCount = activeTab ? Number((activeTab.textContent.match(/(\d+)\s*$/) || [])[1]) : null
  const chipCount = activeChip ? Number((activeChip.textContent.match(/(\d+)\s*$/) || [])[1]) : null
  return {
    tag,
    path: win.location.pathname + win.location.search,
    activeDomain: activeTab ? activeTab.textContent.trim().replace(/\s+/g, ' ') : null,
    activeChip: activeChip ? activeChip.textContent.trim().replace(/\s+/g, ' ') : null,
    chips: chips.length,
    cards: cards.length,
    // 计数口径：选中域时看域 tab 的数字，选中子分类时看 chip 的数字
    countShown: activeChip ? chipCount : tabCount,
    countMatchesCards: (activeChip ? chipCount : tabCount) === cards.length,
  }
}

async function interact(win, doc, cfg) {
  const out = [snapState(win, doc, 'init')]
  for (const st of cfg.steps || []) {
    const sel = st.kind === 'domain' ? '.filter-bar .domain-tab' : '.filter-bar .chip'
    const el = findByText(doc, sel, st.label)
    if (!el) { out.push({ tag: st.kind + ':' + st.label, error: 'not-found' }); continue }
    const before = win.location.href
    el.click()
    // 等路由跳转 + 列表重渲染
    await waitFor(() => win.location.href !== before, 4000)
    await sleep(700)
    out.push(snapState(win, doc, st.kind + ':' + st.label))
  }
  return out
}

/* AC-2：汉堡 → 抽屉打开 → 点遮罩 → 抽屉关闭。三项都要真发生 */
async function drawerTest(win, doc) {
  const sb = () => doc.querySelector('aside.sidebar')
  const ov = () => doc.querySelector('.overlay')
  /* 离屏 iframe 里 CSS 过渡不推进，getComputedStyle 会一直返回起始值（看起来「没动」）。
   * 临时关掉 transition 再读，拿到的是**目标值**，才能真正判断抽屉有没有归位。 */
  const targetTransform = () => {
    const s = sb()
    if (!s) return null
    const prev = s.style.transition
    s.style.transition = 'none'
    void s.offsetWidth
    const t = win.getComputedStyle(s).transform
    s.style.transition = prev
    return t
  }
  const snap = (tag) => {
    const s = sb()
    return {
      tag,
      open: s ? s.classList.contains('open') : null,
      overlayShown: ov() ? ov().classList.contains('show') : null,
      transform: targetTransform(),
      hamburgerW: (() => {
        const h = doc.querySelector('.mobile-header .hamburger')
        return h ? Math.round(h.getBoundingClientRect().width) : null
      })(),
    }
  }
  const out = [snap('init')]
  const btn = doc.querySelector('.mobile-header .hamburger')
  if (!btn) return [{ tag: 'init', error: 'no-hamburger' }]
  btn.click(); await sleep(520); out.push(snap('after-open'))
  const o = ov()
  if (o) { o.click(); await sleep(520); out.push(snap('after-overlay-close')) }
  return out
}

/* AC-3：筛选一次（进历史）→ 浏览器返回键 → 必须回到原范围且计数复原 */
async function backTest(win, doc) {
  const out = [snapState(win, doc, 'init')]
  const el = findByText(doc, '.filter-bar .domain-tab', '币圈')
  if (!el) return [{ tag: 'init', error: 'no-domain-tab' }]
  const before = win.location.href
  el.click()
  await waitFor(() => win.location.href !== before, 4000)
  await sleep(700)
  out.push(snapState(win, doc, 'after-filter'))
  win.history.back()
  await waitFor(() => win.location.href === before, 4000)
  await sleep(700)
  out.push(snapState(win, doc, 'after-back'))
  return out
}

/* AC-5：命令面板分类检索 —— 输入「交」必须命中「交易所 CEX」，点击即进入 /?c=cex */
async function paletteTest(win, doc) {
  const out = []
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }))
  await waitFor(() => doc.querySelector('.cp-input'), 3000)
  const input = doc.querySelector('.cp-input')
  if (!input) return [{ tag: 'open', error: 'no-palette' }]
  out.push({ tag: 'opened', panel: !!doc.querySelector('.cp-panel') })

  input.value = '交'
  input.dispatchEvent(new win.Event('input', { bubbles: true }))
  await sleep(450)
  const groups = Array.from(doc.querySelectorAll('.cp-group')).map(g => ({
    label: (g.querySelector('.cp-group-label')?.textContent || '').trim(),
    items: Array.from(g.querySelectorAll('.cp-item')).map(i => i.textContent.trim())
  }))
  const catGroup = groups.find(g => g.label === '分类')
  const hitItem = catGroup ? catGroup.items.find(t => t.startsWith('交易所 CEX')) : null
  out.push({ tag: 'typed-交', groups: groups.map(g => g.label + ':' + g.items.length).join(','), categoryHit: !!hitItem })

  const before = win.location.href
  const el = Array.from(doc.querySelectorAll('.cp-item')).find(e => e.textContent.trim().startsWith('交易所 CEX'))
  if (el) el.click()
  await waitFor(() => win.location.href !== before, 4000)
  await sleep(600)
  const chips = Array.from(doc.querySelectorAll('.filter-bar .chip'))
  const activeChip = chips.find(c => c.classList.contains('active'))
  out.push({
    tag: 'clicked',
    path: win.location.pathname + win.location.search,
    activeChip: activeChip ? activeChip.textContent.trim().replace(/\s+/g, ' ') : null,
    cards: doc.querySelectorAll('.cards-grid .card, .cards-list .card').length
  })
  return out
}

/* AC-7：仅用键盘 —— 聚焦侧栏「收藏」回车切范围；Ctrl+K 输入后回车选分类；卡片访问链接可聚焦 */
async function keyboardTest(win, doc) {
  const out = []
  const nav = (tag, extra) => ({
    tag,
    path: win.location.pathname + win.location.search,
    activeNav: (doc.querySelector('.sidebar-nav-item.active')?.textContent || '').trim(),
    ...extra
  })
  out.push(nav('init'))

  const fav = Array.from(doc.querySelectorAll('.sidebar-nav-item')).find(el => el.textContent.trim().startsWith('收藏'))
  if (!fav) return [{ tag: 'init', error: 'no-fav-item' }]
  fav.focus()
  const focusOk = doc.activeElement === fav
  const before = win.location.href
  fav.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
  await waitFor(() => win.location.href !== before, 4000)
  await sleep(600)
  out.push(nav('enter-favorites', { focusOk }))

  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }))
  await waitFor(() => doc.querySelector('.cp-input'), 3000)
  const input = doc.querySelector('.cp-input')
  if (!input) { out.push({ tag: 'palette', error: 'no-palette' }); return out }
  input.value = '交易所'
  input.dispatchEvent(new win.Event('input', { bubbles: true }))
  await sleep(450)
  const b2 = win.location.href
  input.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
  await waitFor(() => win.location.href !== b2, 4000)
  await sleep(600)

  // 「打开站点」这一步在卡片里由 <a class="card-visit"> 承载，键盘用户靠 Tab 到它再回车
  const visit = doc.querySelector('.cards-grid .card-visit, .cards-list .card-visit')
  if (visit) visit.focus()
  out.push(nav('enter-category', {
    visitFocusable: !!visit && doc.activeElement === visit,
    visitHref: visit ? visit.getAttribute('href') : null
  }))
  return out
}

/* AC-10：折叠态在刷新后保留（versionedPersist） */
async function persistTest(win, doc, frame) {
  const read = (d, w) => ({
    collapsed: !!d.querySelector('aside.sidebar')?.classList.contains('collapsed'),
    width: (() => { const s = d.querySelector('aside.sidebar'); return s ? Math.round(s.getBoundingClientRect().width) : null })(),
    vw: w ? w.innerWidth : null
  })
  const out = [{ tag: 'init', ...read(doc, win) }]
  const toggle = doc.querySelector('.sidebar-collapse-toggle')
  if (!toggle) return [{ tag: 'init', error: 'no-toggle' }]
  // 后台标签页里首次点击偶发丢失，点到真的折叠为止（最多 3 次）
  for (let i = 0; i < 3; i++) {
    toggle.click()
    await sleep(500)
    if (doc.querySelector('aside.sidebar')?.classList.contains('collapsed')) break
  }
  out.push({ tag: 'after-collapse', ...read(doc, win) })

  const p = new Promise(res => {
    let done = false
    const fin = () => { if (!done) { done = true; res() } }
    frame.addEventListener('load', fin, { once: true })
    setTimeout(fin, 9000)
  })
  frame.contentWindow.location.reload()
  await p
  await waitFor(() => frame.contentDocument?.querySelector('main.main'), 9000)
  await sleep(1300)
  const d2 = frame.contentDocument
  out.push({ tag: 'after-reload', ...read(d2, frame.contentWindow) })

  // 复原，避免污染后续用例
  d2.querySelector('.sidebar-collapse-toggle')?.click()
  await sleep(450)
  return out
}

/* AC-9：八项能力巡检 */
async function capabilityTest(win, doc, frame) {
  const has = s => !!doc.querySelector(s)
  const click = s => { const el = doc.querySelector(s); if (el) el.click(); return !!el }
  const res = {}

  // 1 收藏：卡片收藏按钮可切换
  const favBtn = doc.querySelector('.card-fav-btn')
  if (favBtn) {
    const was = favBtn.classList.contains('favorited')
    favBtn.click(); await sleep(350)
    res.favorite = doc.querySelector('.card-fav-btn')?.classList.contains('favorited') !== was
    doc.querySelector('.card-fav-btn')?.click(); await sleep(250)
  } else res.favorite = false

  // 2 批量选择：工具栏「选择」→ 卡片出现复选框（工具栏已并入 MainToolbar）
  click('.main-toolbar .toolbar-btn'); await sleep(400)
  res.batchSelect = has('.card-checkbox')
  click('.main-toolbar .toolbar-btn'); await sleep(350)

  // 3 拖拽排序：工具栏「手动排序」→ 卡片出现拖拽手柄
  click('.main-toolbar .drag-toggle'); await sleep(450)
  res.dragSort = has('.drag-handle')
  click('.main-toolbar .drag-toggle'); await sleep(350)

  // 4 历史 / 5 回收站：侧栏范围项齐备
  const navText = Array.from(doc.querySelectorAll('.sidebar-nav-item')).map(n => n.textContent.trim()).join('|')
  res.history = navText.includes('最近')
  res.trash = navText.includes('回收站')

  // 6 命令面板：Ctrl+K 打开、ESC 关闭
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }))
  await waitFor(() => doc.querySelector('.cp-panel'), 3000)
  res.palette = has('.cp-panel')
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
  await sleep(350)

  // 7 待办：工具栏入口打开面板（入口随统计条下沉已迁到 MainToolbar）
  click('.main-toolbar [aria-label="待办事项"]'); await sleep(450)
  res.todo = has('.todo-panel')
  doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
  await sleep(300)

  // 8 管理后台：客户端路由 /admin 能渲染
  const p = new Promise(r => {
    let done = false
    const fin = () => { if (!done) { done = true; r() } }
    frame.addEventListener('load', fin, { once: true })
    setTimeout(fin, 9000)
  })
  frame.contentWindow.location.href = '/admin'
  await p
  // AdminView 是懒加载路由，dev 下首帧还要按需编译，固定等待会误判
  await waitFor(() => frame.contentDocument?.querySelector('.admin-view'), 9000)
  res.admin = !!frame.contentDocument?.querySelector('.admin-view')

  return [{ tag: 'capabilities', ...res }]
}

async function runCase(cfg) {
  const f = document.createElement('iframe')
  f.style.width = cfg.w + 'px'
  f.style.height = cfg.h + 'px'
  f.setAttribute('src', cfg.path)
  document.body.appendChild(f)

  await new Promise(res => {
    let done = false
    const finish = () => { if (!done) { done = true; res() } }
    f.addEventListener('load', finish, { once: true })
    setTimeout(finish, 10000)
  })

  // 等 Vue 挂载 + 站点数据落地（轮询 .cards-container / 状态视图）
  await waitFor(() => {
    const d = f.contentDocument
    if (!d) return false
    return !!(d.querySelector('main.main') && d.querySelector('.sidebar-nav-item'))
  }, 9000)
  await sleep(1400)

  let res
  try {
    res = measure(f.contentWindow, f.contentDocument, cfg)
  } catch (e) {
    res = { cfg: cfg.path + ' @' + cfg.w, error: String(e) }
  }
  log('RESULT ' + JSON.stringify(res))

  if (cfg.steps) {
    let steps
    try {
      steps = await interact(f.contentWindow, f.contentDocument, cfg)
    } catch (e) {
      steps = [{ error: String(e) }]
    }
    log('STEPS ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
  }

  if (cfg.drawer) {
    try {
      const steps = await drawerTest(f.contentWindow, f.contentDocument)
      log('DRAWER ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('DRAWER-FAIL ' + cfg.path + ' ' + e) }
  }
  if (cfg.back) {
    try {
      const steps = await backTest(f.contentWindow, f.contentDocument)
      log('BACK ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('BACK-FAIL ' + cfg.path + ' ' + e) }
  }
  if (cfg.palette) {
    try {
      const steps = await paletteTest(f.contentWindow, f.contentDocument)
      log('PALETTE ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('PALETTE-FAIL ' + cfg.path + ' ' + e) }
  }
  if (cfg.keyboard) {
    try {
      const steps = await keyboardTest(f.contentWindow, f.contentDocument)
      log('KEYBOARD ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('KEYBOARD-FAIL ' + cfg.path + ' ' + e) }
  }
  if (cfg.persist) {
    try {
      const steps = await persistTest(f.contentWindow, f.contentDocument, f)
      log('PERSIST ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('PERSIST-FAIL ' + cfg.path + ' ' + e) }
  }
  if (cfg.capability) {
    try {
      const steps = await capabilityTest(f.contentWindow, f.contentDocument, f)
      log('CAPABILITY ' + JSON.stringify({ cfg: cfg.path + ' @' + cfg.w, steps }))
    } catch (e) { log('CAPABILITY-FAIL ' + cfg.path + ' ' + e) }
  }

  f.remove()
  await sleep(250)
}

/* 收藏页验收的前提是先有收藏：iframe 与探针同源，共用 localStorage，
 * 所以先按真实站点 id 写一份收藏，否则收藏页恒为 0 条，「范围有没有被保住」就验不出来。 */
async function seedFavorites() {
  const res = await fetch('/api/sites-data.json')
  const sites = await res.json()
  const pick = []
    .concat(sites.filter(s => s.categoryId === 'cex').slice(0, 4).map(s => s.id))
    .concat(sites.filter(s => s.categoryId === 'wallet').slice(0, 3).map(s => s.id))
    .concat(sites.filter(s => s.categoryId === 'sms').slice(0, 2).map(s => s.id))
  localStorage.setItem('favorites', JSON.stringify({ favoriteIds: pick, __navDataVersion: 1 }))
  return pick
}

;(async () => {
  // 运行指纹：用来分辨「本次真的重跑」还是浏览器给了缓存的旧 DOM
  log('RUN ' + new Date().toISOString() + ' nonce=' + Math.random().toString(36).slice(2, 8)
    + ' visibility=' + document.visibilityState + ' vw=' + window.innerWidth)

  /* 若这个源上残留着旧的生产 SW（曾在本机跑过 dist/preview），它会用预缓存拦截
   * iframe 里的应用模块，探针就会测到旧代码 —— 现象是「改了源码结果不变」。
   * 先注销 SW 并清空 CacheStorage，保证 iframe 拉到的是当前 dev 源码。 */
  try {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations()
      await Promise.all(regs.map(r => r.unregister()))
      log('SW-CLEAR unregistered=' + regs.length)
    }
    if (window.caches) {
      const keys = await caches.keys()
      await Promise.all(keys.map(k => caches.delete(k)))
      log('SW-CLEAR caches-deleted=' + keys.length)
    }
  } catch (e) { log('SW-CLEAR-FAIL ' + e) }

  let favIds = []
  try {
    favIds = await seedFavorites()
    log('SEED favorites=' + favIds.length + ' ' + favIds.join(','))
  } catch (e) {
    log('SEED-FAIL ' + e)
  }

  for (const cfg of CASES) {
    try { await runCase(cfg) } catch (e) { log('CASE-FAIL ' + cfg.path + ' @' + cfg.w + ' ' + e) }
  }
  log('DONE ' + CASES.length + ' cases')

  // 回传收集器，便于离线审阅（收集器未启动时静默忽略）
  try {
    await fetch('http://127.0.0.1:4599/report', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ cases: CASES.length, lines })
    })
    log('POSTED')
  } catch (e) {
    log('POST-SKIP ' + String(e))
  }
})()
</script>
