<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>interaction probe</title>
<style>
  body { font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 12px; background: #0b0b0f; color: #b9f6ca; }
  pre { white-space: pre-wrap; margin: 0; }
  iframe { position: fixed; left: -20000px; top: 0; border: 0; }
</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<script>
const out = document.getElementById('out')
const lines = []
function log(s) { lines.push(s); out.textContent = lines.join('\n') }
const sleep = ms => new Promise(r => setTimeout(r, ms))

function waitFor(fn, timeout = 9000, step = 120) {
  return new Promise((resolve) => {
    const t0 = Date.now()
    const tick = () => {
      let v = false
      try { v = fn() } catch (e) { v = false }
      if (v) return resolve(true)
      if (Date.now() - t0 > timeout) return resolve(false)
      setTimeout(tick, step)
    }
    tick()
  })
}

const round = n => (typeof n === 'number' && isFinite(n) ? Math.round(n * 10) / 10 : n)

function makeIframe(w, h, path) {
  const f = document.createElement('iframe')
  f.style.width = w + 'px'
  f.style.height = h + 'px'
  f.setAttribute('src', path)
  document.body.appendChild(f)
  return f
}

function probe(f) {
  const d = f.contentDocument, w = f.contentWindow
  const q = s => d.querySelector(s)
  const cs = (el, p) => { try { return el ? w.getComputedStyle(el)[p] : null } catch (e) { return null } }
  const active = Array.from(d.querySelectorAll('.sidebar-nav .sidebar-nav-item')).find(n => n.classList.contains('active'))
  const activeTab = Array.from(d.querySelectorAll('.mobile-tabbar .tab')).find(t => t.classList.contains('active'))
  return {
    url: w.location.pathname + w.location.search,
    title: d.title,
    sidebarTransform: cs(q('aside.sidebar'), 'transform'),
    sidebarW: round(q('aside.sidebar')?.getBoundingClientRect().width),
    sbInlineW: q('aside.sidebar')?.style.width,
    sbInlineMinW: q('aside.sidebar')?.style.minWidth,
    sidebarCollapsed: q('aside.sidebar')?.classList.contains('collapsed'),
    overlayShown: q('.overlay')?.classList.contains('show'),
    activeNav: active ? active.textContent.trim() : null,
    activeTab: activeTab ? activeTab.textContent.trim() : null,
    batchBar: !!q('.batch-bar'),
    palette: !!q('.cp-panel'),
    errors: w.__probeErrors || []
  }
}

async function runMobile() {
  const f = makeIframe(375, 812, '/')
  await new Promise(r => f.addEventListener('load', r, { once: true }))
  await waitFor(() => f.contentDocument?.querySelector('.mobile-tabbar .tab'))
  await sleep(1200)
  const d = f.contentDocument, w = f.contentWindow
  w.__probeErrors = []
  w.addEventListener('error', e => w.__probeErrors.push(String(e.message)))

  const tabs = () => Array.from(d.querySelectorAll('.mobile-tabbar .tab'))
  const snap = (label) => log('M ' + label + ' ' + JSON.stringify(probe(f)))

  snap('baseline')

  d.querySelector('.hamburger').click(); await sleep(500); snap('after-hamburger')
  d.querySelector('.overlay').click(); await sleep(500); snap('after-overlay-close')

  tabs()[3].click(); await sleep(500); snap('after-tab-more')
  d.querySelector('.overlay').click(); await sleep(400)

  tabs()[1].click(); await sleep(600); snap('after-tab-favorites')
  w.history.back(); await sleep(700); snap('after-back')

  tabs()[0].click(); await sleep(600); snap('after-tab-all')

  d.querySelector('.hamburger').click(); await sleep(500)
  const cex = Array.from(d.querySelectorAll('.sidebar-category')).find(c => c.textContent.includes('交易所 CEX'))
  if (cex) { cex.click(); await sleep(700) }
  snap('after-drawer-category')
  log('M drawer-open-after-nav ' + JSON.stringify({ open: f.contentDocument.querySelector('aside.sidebar').classList.contains('open') }))

  f.remove()
}

async function runDesktop() {
  const f = makeIframe(1440, 900, '/')
  await new Promise(r => f.addEventListener('load', r, { once: true }))
  await waitFor(() => f.contentDocument?.querySelector('.sidebar-nav-item'))
  await sleep(1400)
  const d = f.contentDocument, w = f.contentWindow
  w.__probeErrors = []
  w.addEventListener('error', e => w.__probeErrors.push(String(e.message)))

  const snap = (label) => log('D ' + label + ' ' + JSON.stringify(probe(f)))
  snap('baseline')

  d.querySelector('.sidebar-collapse-toggle').click(); await sleep(500); snap('after-collapse')
  d.querySelector('.sidebar-collapse-toggle').click(); await sleep(500); snap('after-expand')

  const cex = Array.from(d.querySelectorAll('.sidebar-category')).find(c => c.textContent.includes('交易所 CEX'))
  if (cex) { cex.click(); await sleep(700) }
  snap('after-click-category')

  const input = d.querySelector('.unified-search-input')
  input.value = 'binance'
  input.dispatchEvent(new w.Event('input', { bubbles: true }))
  await sleep(1100); snap('after-search-type')

  const clearBtn = d.querySelector('.search-clear')
  if (clearBtn) { clearBtn.click(); await sleep(1100) }
  snap('after-search-clear')

  d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }))
  await sleep(400); snap('after-ctrl-k')
  const cpInput = d.querySelector('.cp-panel input')
  if (cpInput) { cpInput.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })) }
  await sleep(400); snap('after-escape')

  const selBtn = Array.from(d.querySelectorAll('.toolbar-btn')).find(b => b.textContent.includes('选择'))
  if (selBtn) { selBtn.click(); await sleep(400) }
  const card = d.querySelector('.card')
  if (card) { card.click(); await sleep(500) }
  snap('after-batch-select')

  const cancelBtn = Array.from(d.querySelectorAll('.batch-btn')).find(b => b.textContent.includes('取消全选'))
  if (cancelBtn) { cancelBtn.click(); await sleep(400) }
  const exitBtn = Array.from(d.querySelectorAll('.toolbar-btn')).find(b => b.textContent.includes('取消选择'))
  if (exitBtn) { exitBtn.click(); await sleep(400) }
  snap('after-batch-exit')

  const dragBtn = Array.from(d.querySelectorAll('.drag-toggle')).find(b => b.textContent.includes('排序'))
  if (dragBtn) { dragBtn.click(); await sleep(400) }
  snap('after-drag-toggle')

  f.remove()
}

;(async () => {
  try { await runMobile() } catch (e) { log('MOBILE-FAIL ' + e) }
  try { await runDesktop() } catch (e) { log('DESKTOP-FAIL ' + e) }
  log('DONE')
})()
</script>
</body>
</html>
